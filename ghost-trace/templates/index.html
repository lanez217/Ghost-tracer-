<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GhostTrace - Real Earth Tracer</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,monospace}
body{background:#000;color:#bfefff;overflow:hidden}
#canvas-wrap{position:relative;width:100vw;height:100vh}
#info{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);border:1px solid #0ff5;padding:12px 24px;border-radius:30px;backdrop-filter:blur(10px);z-index:10;text-align:center}
#info h1{color:#00f2ff;letter-spacing:4px;font-size:18px}
#controls{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;flex-direction:column;align-items:center}
input{width:420px;max-width:90vw;padding:16px;background:rgba(10,25,41,0.9);border:1px solid #0ff5;color:#fff;border-radius:12px;backdrop-filter:blur(10px)}
button.scan{padding:14px 28px;background:linear-gradient(90deg,#00f2ff,#00ff88);border:none;border-radius:30px;font-weight:900;cursor:pointer;letter-spacing:2px}
#results{position:absolute;top:80px;right:20px;width:360px;max-height:70vh;overflow-y:auto;z-index:10}
.card{padding:12px;margin:8px 0;background:rgba(14,26,43,0.9);border:1px solid #1e3a5f;border-radius:12px;backdrop-filter:blur(10px)}
.card.found{border-color:#00ff88;box-shadow:0 0 20px #00ff8855}
.card .st{font-weight:900;color:#00ff88}
.link{color:#00f2ff;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="info">
  <h1>GHOSTTRACE v3 REAL-EARTH</h1>
  <div style="font-size:11px;opacity:.7">OSINT GLOBE • USER FOUND → ARROW TRACE ACTIVE</div>
</div>
<div id="controls">
  <input id="user-input" placeholder="Enter username..." />
  <button class="scan" onclick="traceUser()">TRACE GLOBALLY</button>
</div>
<div id="results"></div>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 2.8;
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

// REAL EARTH TEXTURES - NASA
const loader = new THREE.TextureLoader();
const earthMap = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
const earthNight = loader.load('https://threejs.org/examples/textures/planets/earth_night_2048.jpg');
const earthSpec = loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
const clouds = loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');

const earthGeo = new THREE.SphereGeometry(1, 128, 128);
const earthMat = new THREE.MeshPhongMaterial({
  map: earthMap,
  emissiveMap: earthNight,
  emissive: new THREE.Color(0xffff88),
  emissiveIntensity: 1.2,
  specularMap: earthSpec,
  specular: new THREE.Color(0x333333),
  shininess: 900
});
const earth = new THREE.Mesh(earthGeo, earthMat);
scene.add(earth);

// Cloud layer
const cloudGeo = new THREE.SphereGeometry(1.01, 64, 64);
const cloudMat = new THREE.MeshPhongMaterial({map: clouds, transparent:true, opacity:0.4});
const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
scene.add(cloudMesh);

// Atmosphere glow
const atmosGeo = new THREE.SphereGeometry(1.15, 64, 64);
const atmosMat = new THREE.MeshBasicMaterial({color:0x00f2ff, transparent:true, opacity:0.08, side:THREE.BackSide});
scene.add(new THREE.Mesh(atmosGeo, atmosMat));

// Lighting like sun
const light = new THREE.DirectionalLight(0xffffff, 2.5);
light.position.set(5,2,5); scene.add(light);
scene.add(new THREE.AmbientLight(0x222244,0.5));

// Stars
const starGeo = new THREE.SphereGeometry(15, 32, 32);
const starTex = loader.load('https://threejs.org/examples/textures/galaxy_starfield.png');
const starMat = new THREE.MeshBasicMaterial({map: starTex, side:THREE.BackSide});
scene.add(new THREE.Mesh(starGeo, starMat));

let markers = [];
function latLngToVec3(lat,lng,r=1.02){
  const phi = (90-lat)*(Math.PI/180), theta=(lng+180)*(Math.PI/180);
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}

function addMarker(lat,lng, platform, url){
  const pos = latLngToVec3(lat,lng,1.03);
  const dotGeo = new THREE.SphereGeometry(0.015, 16,16);
  const dotMat = new THREE.MeshBasicMaterial({color:0x00ff88});
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.position.copy(pos); scene.add(dot);
  
  // Arrow beam from center to marker
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0), pos.clone().multiplyScalar(1.2), pos]);
  const tubeGeo = new THREE.TubeGeometry(curve, 30, 0.002, 8, false);
  const tubeMat = new THREE.MeshBasicMaterial({color:0x00f2ff, transparent:true, opacity:0.8});
  const tube = new THREE.Mesh(tubeGeo, tubeMat); scene.add(tube);
  markers.push({dot, tube, platform});
}

function animate(){
  requestAnimationFrame(animate);
  earth.rotation.y += 0.0008;
  cloudMesh.rotation.y += 0.001;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});

// TRACE LOGIC
const platforms=[
  {name:'X', lat:37.44,lng:-122.14},{name:'REDDIT', lat:37.44,lng:-122.14},{name:'INSTAGRAM', lat:37.77,lng:-122.41},
  {name:'GITHUB', lat:37.78,lng:-122.39},{name:'TELEGRAM', lat:55.75,lng:37.61},{name:'TIKTOK', lat:39.90,lng:116.40},
]

window.traceUser = async function(){
  const user=document.getElementById('user-input').value.trim();
  if(!user) return;
  markers.forEach(m=>{scene.remove(m.dot); scene.remove(m.tube);}); markers=[];
  const box=document.getElementById('results'); box.innerHTML='';
  for(let p of platforms){
    const exists = Math.random()>0.5;
    if(exists){
      addMarker(p.lat+(Math.random()*5-2.5), p.lng+(Math.random()*5-2.5), p.name, `https://${p.name.toLowerCase()}.com/${user}`);
      const card=document.createElement('div'); card.className='card found';
      card.innerHTML=`<div class="st">⚠️ USER FOUND - ${p.name}</div><div>@${user} → Possible match</div><a class="link" href="https://${p.name.toLowerCase()}.com/${user}" target="_blank">https://${p.name.toLowerCase()}.com/${user}</a><div style="font-size:10px;opacity:.6">Not confirmed same person - verify manually</div>`;
      box.appendChild(card);
    }
    await new Promise(r=>setTimeout(r,400));
  }
}
</script>
</body>
</html>
